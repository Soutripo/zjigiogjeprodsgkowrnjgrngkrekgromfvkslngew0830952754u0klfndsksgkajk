<style>
  :root{--b:#1f77a6;--ink:#1f2d3a;--mut:#567;--line:#cfdde8;--bad:#b00020;--ok:#16794a}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;color:var(--ink);background:#f2f6f9;font-size:15px;line-height:1.6}
  h1{font-size:19px;margin:0}
  h2{font-size:16px;margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid var(--b)}
  label{display:block;font-size:13px;color:var(--mut);margin:0 0 3px}
  input,select{font:inherit;padding:8px;border:1px solid #9bb;border-radius:4px;background:#fff;color:var(--ink);max-width:100%}
  input[type=checkbox]{width:18px;height:18px;padding:0;vertical-align:middle}
  button{font:inherit;font-weight:700;padding:9px 20px;border:1px solid var(--b);background:var(--b);color:#fff;border-radius:4px;cursor:pointer}
  button.sub{background:#fff;color:var(--b)} button.del{background:#fff;color:var(--bad);border-color:var(--bad)}
  button:disabled{opacity:.5;cursor:default}
  #login{max-width:360px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:6px;padding:22px}
  #login input{width:100%;margin-bottom:12px}
  #login button{width:100%}
  .msg{min-height:1.5em;margin-top:10px;font-size:14px;white-space:pre-wrap}
  .msg.bad,.bad-t{color:var(--bad)} .msg.ok,.ok-t{color:var(--ok)}
  #main{max-width:1000px;margin:0 auto;padding:12px}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
  section{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px}
  .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .g>div>input,.g>div>select{width:100%}
  .days label{display:inline-block;margin-right:14px;color:var(--ink);font-size:15px}
  .hint{font-size:12px;color:var(--mut);margin-top:3px}
  .scroll{max-height:55vh;overflow:auto;border:1px solid var(--line);border-radius:4px;margin-top:12px}
  table{border-collapse:collapse;width:100%}
  th,td{border-bottom:1px solid var(--line);padding:3px 8px;text-align:left}
  thead th{position:sticky;top:0;background:#e8f1f7;z-index:1;font-size:13px}
  #st td.t{width:1%;white-space:nowrap} #st input.xt{width:96px}
  #st tr.on{background:#eef7ee} #st input.bad{border-color:var(--bad);background:#fff0f0}
  #sum{margin-top:10px;font-size:15px;min-height:1.6em} #sum.bad{color:var(--bad)}
  .act{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
  #list td.o{white-space:nowrap} #list tr.past{color:#899}
  #list button{padding:4px 10px;font-size:13px;margin-right:4px}
  @media(max-width:600px){#st input.xt{width:78px}}
</style>
</head>
<body>
<div id="login">
  <h1>臨時列車の登録</h1>
  <p class="hint" style="margin:6px 0 14px">管理者のIDでログインしてください。</p>
  <form id="lgForm" autocomplete="off">
    <label for="lgId">ID</label><input id="lgId" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
    <label for="lgPw">パスワード</label><input id="lgPw" type="password" autocomplete="current-password">
    <button id="lgBtn" type="submit">ログイン</button>
  </form>
  <div id="lgMsg" class="msg" role="status" aria-live="polite"></div>
</div>

<div id="main" hidden>
  <header><h1>臨時列車の登録</h1><button type="button" class="sub" id="logout">ログアウト</button></header>

  <section>
    <h2 id="formTitle">新しく登録する</h2>
    <div class="g">
      <div><label for="fDate">運転日 <b class="bad-t">*</b></label><input type="date" id="fDate"></div>
      <div><label for="fNo">列車番号</label><input type="text" id="fNo" maxlength="20" placeholder="例 9101"></div>
      <div><label for="fType">種別</label><select id="fType"></select></div>
      <div><label for="fDash">線の種類</label><select id="fDash"></select></div>
      <div><label for="fLw">線の太さ</label><select id="fLw"></select></div>
      <div><label for="fNote">備考</label><input type="text" id="fNote" maxlength="100" placeholder="例 団体臨時"></div>
    </div>
    <div class="days" style="margin-top:12px"><label style="display:block">表示するダイヤ <b class="bad-t">*</b></label>
      <label><input type="checkbox" id="d_weekday"> 平日</label><label><input type="checkbox" id="d_holiday"> 休日</label>
      <div class="hint" id="dayHint">運転日を入れると、その日のダイヤ(平日・休日)が自動で選ばれます。</div></div>
    <div class="hint" style="margin-top:12px">時刻を入れた駅を通ります(空欄の駅は飛ばします)。「1347」「13:47」「13:47:30」のどれでも入れられます。着か発の片方だけなら、同じ時刻になります。通過にチェックすると、通過時刻として扱います。</div>
    <div class="scroll"><table id="st"><thead><tr><th>駅</th><th>着</th><th>発</th><th>通過</th></tr></thead><tbody id="rows"></tbody></table></div>
    <div id="sum" role="status"></div>
    <div class="act"><button type="button" id="save">登録する</button><button type="button" class="sub" id="clear">入力をクリア</button><span id="saveMsg" class="msg" style="margin:0"></span></div>
  </section>

  <section>
    <h2>登録済みの臨時列車</h2>
    <label style="display:inline-block;color:var(--ink);font-size:14px"><input type="checkbox" id="showPast"> 運転日を過ぎたものも表示</label>
    <div class="scroll" style="max-height:none"><table id="list"><thead><tr><th>運転日</th><th>列車</th><th>区間</th><th>備考</th><th></th></tr></thead><tbody id="listBody"></tbody></table></div>
    <div id="listMsg" class="msg"></div>
  </section>
</div>

<script>
'use strict';
const GAS_URL="https://script.google.com/macros/s/AKfycbyIF4vrLdoJFMoAJY89Cgrbb1VrYxyRKE_SM3BD7w0PYupJ-RpnKOMDaJST_VgzzcT0/exec";
const $=id=>document.getElementById(id);
const S={tok:'',dev:null,w:null,api:null,editing:null,list:[]};
const mk=(tag,cls,txt)=>{ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!==undefined) e.textContent=txt; return e; };
const todayStr=()=>{ const t=new Date(), z=n=>String(n).padStart(2,'0'); return t.getFullYear()+'-'+z(t.getMonth()+1)+'-'+z(t.getDate()); };

/* 端末ID: ログイン画面(index.html)と同じ場所・同じ作り方(同じブラウザなら同じ端末として扱われる) */
function devId(){
  try{
    let v=localStorage.getItem('gy_dev');
    if(!/^[0-9a-f]{32}$/.test(v||'')){
      const a=new Uint8Array(16); crypto.getRandomValues(a);
      v=Array.from(a,b=>('0'+b.toString(16)).slice(-2)).join(''); localStorage.setItem('gy_dev',v);
      if(localStorage.getItem('gy_dev')!==v) return null;
    }
    return v;
  }catch(_){ return null; }
}
async function post(body){
  const r=await fetch(GAS_URL,{method:'POST',body:JSON.stringify(body),redirect:'follow',cache:'no-store'});
  return r.json();
}
async function gas(a,extra){
  let res;
  try{ res=await post(Object.assign({a:a,tok:S.tok,dev:S.dev},extra)); }
  catch(_){ const e=new Error('接続できません。通信状態を確認してください'); e.net=true; throw e; }
  if(res&&res.tok) S.tok=res.tok;
  if(!res||!res.ok){
    if(res&&res.code==='auth'){ alert('ログインの有効期限が切れました。ログインし直してください。'); location.reload(); }
    const e=new Error((res&&res.msg)||'エラーが発生しました'); throw e;
  }
  return res;
}

/* ---------- ログイン ---------- */
$('lgForm').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const msg=$('lgMsg'), btn=$('lgBtn'), say=(t,bad)=>{ msg.textContent=t; msg.className='msg'+(bad?' bad':''); };
  const dev=devId(); if(!dev){ say('このブラウザでは使えません(端末の登録ができません)',true); return; }
  btn.disabled=true; say('確認中…');
  try{
    const res=await post({a:'login',id:$('lgId').value.trim(),pw:$('lgPw').value,dev:dev});
    if(!res||!res.ok||!res.key){ say((res&&res.msg)||'ログインできません',true); $('lgPw').value=''; return; }
    if(!res.tok){ say('ログイン管理サーバー(GAS)が、まだ臨時列車の登録に対応していません。README の手順でGASを更新してください',true); return; }
    if(!res.adm){ say('このIDは管理者ではありません',true); $('lgPw').value=''; return; }
    S.tok=res.tok; S.dev=dev;
    say('運行図表の駅の情報を読み込んでいます…');
    await loadDiagram(res.key);
    buildForm(); $('login').hidden=true; $('main').hidden=false;
    await refresh();
  }catch(e){ say(e&&e.diag?e.message:'接続できません。通信状態を確認してください',true); console.warn(e); }
  finally{ btn.disabled=false; }
});
$('logout').addEventListener('click',()=>location.reload());

/* 暗号化された運行図表を開いて、駅の一覧・種別・時刻の読み取りを借りる(ダイヤ改正にも自動で追従する) */
async function loadDiagram(keyHex){
  const fail=t=>{ const e=new Error(t); e.diag=true; return e; };
  const te=new TextEncoder(), key=Uint8Array.from(keyHex.match(/../g),x=>parseInt(x,16)), b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const raw=new Uint8Array(await crypto.subtle.digest('SHA-256',new Uint8Array([...te.encode('chichibu-enc-v1'),...key])));
  const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const r=await fetch('data/diagram.enc.json',{cache:'no-cache'}); if(!r.ok) throw fail('運行図表のデータを読み込めません');
  const o=await r.json(); let html;
  try{ html=new TextDecoder('utf-8').decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(o.iv),additionalData:te.encode('diagram')},k,b64(o.ct))); }
  catch(_){ throw fail('運行図表のデータを復号できません。管理者に連絡してください'); }
  const f=document.createElement('iframe'); f.title='運行図表(駅の情報の読み取り用)'; f.setAttribute('aria-hidden','true');
  f.style.cssText='position:absolute;left:-9999px;top:0;width:1200px;height:800px;border:0;visibility:hidden';
  await new Promise((ok,ng)=>{ f.onload=ok; f.onerror=ng; f.srcdoc=html; document.body.appendChild(f); setTimeout(()=>ng(new Error('timeout')),20000); }).catch(()=>{ throw fail('運行図表を開けません'); });
  const w=f.contentWindow, api=w&&w.__chichibu;
  if(!api||!api.stations||!api.types||typeof w.xParse!=='function'||typeof w.xStr!=='function') throw fail('運行図表の構成が想定と違います。管理者に連絡してください');
  S.w=w; S.api=api;
}

/* ---------- 入力フォーム ---------- */
function buildForm(){
  const w=S.w, api=S.api;
  $('fType').replaceChildren(...Object.entries(api.types).map(([k,v])=>{ const o=mk('option',null,v.label); o.value=k; return o; }));
  $('fType').value=api.types.rinji?'rinji':Object.keys(api.types)[0];
  const opt=a=>a.map(x=>{ const o=mk('option',null,x[1]); o.value=x[0]; return o; });
  $('fDash').replaceChildren(...opt(w.eval('DASHES'))); $('fLw').replaceChildren(...opt(w.eval('WIDTHS')));
  $('rows').replaceChildren(...api.stations.map((s,i)=>{
    const tr=mk('tr'); tr.dataset.i=i;
    const td=(cls)=>{ const c=mk('td',cls); tr.appendChild(c); return c; };
    td().textContent=s.n;
    for(const c of ['xa','xd']){ const i2=mk('input','xt '+c); i2.type='text'; i2.setAttribute('inputmode','numeric'); i2.autocomplete='off'; i2.setAttribute('aria-label',s.n+(c==='xa'?'の着時刻':'の発時刻')); td('t').appendChild(i2); }
    const p=mk('input','xp'); p.type='checkbox'; p.setAttribute('aria-label',s.n+'は通過'); td('t').appendChild(p);
    return tr;
  }));
  clearForm();
}
function onDate(){
  const v=$('fDate').value; if(!/^\d{4}-\d{2}-\d{2}$/.test(v)||!S.api) return;
  const [y,m,d]=v.split('-').map(Number), k=S.api.todayDay(new Date(y,m-1,d));
  $('d_weekday').checked=k==='weekday'; $('d_holiday').checked=k==='holiday';
  $('dayHint').textContent='この日は'+(k==='holiday'?'休日(土日祝)':'平日')+'ダイヤです。両方のダイヤに出したいときは、もう一方にもチェックしてください。';
}
/* 運行図表の臨時列車入力フォームと同じ規則: 空欄の駅は飛ばす / 片方だけなら同じ時刻 / 通過は着=発 / 時刻順に並べて重なりを確認 */
function collect(){
  const P=S.w.xParse, st=S.api.stations, stops=[]; let bad=null;
  document.querySelectorAll('#rows tr').forEach(tr=>{
    const i=+tr.dataset.i, ea=tr.querySelector('.xa'), ed=tr.querySelector('.xd'), ps=tr.querySelector('.xp').checked;
    ea.classList.remove('bad'); ed.classList.remove('bad');
    tr.classList.toggle('on',!!(ea.value.trim()||ed.value.trim()));
    let a=P(ea.value), d=P(ed.value);
    if(Number.isNaN(a)){ ea.classList.add('bad'); bad=bad||st[i].n+'の着時刻が読み取れません'; return; }
    if(Number.isNaN(d)){ ed.classList.add('bad'); bad=bad||st[i].n+'の発時刻が読み取れません'; return; }
    if(a===null&&d===null) return;
    if(a===null) a=d; if(d===null) d=a;
    if(ps){ stops.push([i,a,a,1]); return; }
    if(d<a){ ed.classList.add('bad'); bad=bad||st[i].n+'の発時刻が着時刻より前です'; return; }
    stops.push([i,a,d]);
  });
  if(bad) return {error:bad};
  if(stops.length<2) return {error:'時刻を入れた駅が2つ以上必要です'};
  stops.sort((p,q)=>p[1]-q[1]||p[2]-q[2]);
  for(let k=1;k<stops.length;k++){ if(stops[k][1]<stops[k-1][2]) return {error:st[stops[k][0]].n+'の時刻が重なっています'}; }
  return {stops};
}
function route(stops){ const st=S.api.stations, a=stops[0], z=stops[stops.length-1], t=S.w.xStr; return st[a[0]].n+' '+t(a[2])+' 発 → '+st[z[0]].n+' '+t(z[1])+' 着'; }
function sum(){
  const c=collect(), el=$('sum');
  if(c.error){ el.textContent=c.error; el.className='bad'; }
  else{ el.textContent='この列車: '+route(c.stops)+'('+c.stops.length+'駅)'; el.className=''; }
}
function flash(t,bad){ const m=$('saveMsg'); m.textContent=t; m.className='msg '+(bad?'bad':'ok'); }
function clearForm(){
  S.editing=null; $('formTitle').textContent='新しく登録する'; $('save').textContent='登録する'; flash('');
  ['fDate','fNo','fNote'].forEach(i=>$(i).value=''); $('fType').value=S.api.types.rinji?'rinji':Object.keys(S.api.types)[0]; $('fDash').value='auto'; $('fLw').value='auto';
  $('d_weekday').checked=false; $('d_holiday').checked=false; $('dayHint').textContent='運転日を入れると、その日のダイヤ(平日・休日)が自動で選ばれます。';
  document.querySelectorAll('#rows tr').forEach(tr=>{ tr.querySelector('.xa').value=''; tr.querySelector('.xd').value=''; tr.querySelector('.xp').checked=false; });
  sum(); $('sum').textContent=''; 
}
function fill(r){
  clearForm();
  $('fDate').value=r.opDate; $('fNo').value=r.no||''; $('fType').value=r.type; $('fDash').value=r.dash||'auto'; $('fLw').value=r.lw||'auto'; $('fNote').value=r.note||'';
  $('d_weekday').checked=(r.days||[]).includes('weekday'); $('d_holiday').checked=(r.days||[]).includes('holiday');
  r.stops.forEach(([i,a,d,ps])=>{ const tr=document.querySelector('#rows tr[data-i="'+i+'"]'); if(!tr) return; tr.querySelector('.xa').value=S.w.xStr(a); tr.querySelector('.xd').value=S.w.xStr(d); tr.querySelector('.xp').checked=!!ps; });
  sum(); window.scrollTo({top:0,behavior:'smooth'});
}
async function save(){
  const c=collect(); sum();
  if(c.error){ flash(c.error,true); return; }
  const opDate=$('fDate').value;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(opDate)){ flash('運転日を入れてください',true); return; }
  const days=['weekday','holiday'].filter(k=>$('d_'+k).checked);
  if(!days.length){ flash('表示するダイヤ(平日・休日)を選んでください',true); return; }
  const t={no:$('fNo').value.trim(),type:$('fType').value,dash:$('fDash').value,lw:$('fLw').value,note:$('fNote').value.trim(),opDate:opDate,days:days,stops:c.stops};
  if(S.editing) t.id=S.editing;
  if(t.no&&S.list.some(r=>r.opDate===opDate&&r.no===t.no&&r.id!==S.editing)&&!confirm('同じ運転日・列車番号('+opDate+' '+t.no+')の登録があります。それでも追加しますか?')) return;
  const b=$('save'); b.disabled=true; flash('送信中…');
  try{
    await gas('xput',{train:t});
    const did=S.editing?'更新しました':'登録しました', line=opDate+' '+(t.no||'番号なし')+'  '+route(c.stops);
    clearForm(); flash(did+': '+line); await refresh();
  }catch(e){ flash(e.message,true); }
  finally{ b.disabled=false; }
}

/* ---------- 登録済みの一覧 ---------- */
async function refresh(){
  const m=$('listMsg'); m.textContent=''; m.className='msg';
  try{ S.list=(await gas('xlist')).trains; renderList(); }
  catch(e){ m.textContent=e.message; m.className='msg bad'; }
}
function renderList(){
  const body=$('listBody'), today=todayStr(), all=$('showPast').checked, rows=S.list.filter(r=>all||r.opDate>=today);
  body.replaceChildren(...rows.map(r=>{
    const tr=mk('tr',r.opDate<today?'past':''); tr.appendChild(mk('td','o',r.opDate+(r.opDate===today?'(今日)':'')));
    tr.appendChild(mk('td',null,(r.no||'番号なし')+'  '+(S.api.types[r.type]?S.api.types[r.type].label:r.type)));
    tr.appendChild(mk('td',null,route(r.stops))); tr.appendChild(mk('td',null,r.note||''));
    const op=mk('td','o'), btn=(t,cls,fn)=>{ const b=mk('button',cls,t); b.type='button'; b.addEventListener('click',fn); op.appendChild(b); };
    btn('編集','sub',()=>{ fill(r); S.editing=r.id; $('formTitle').textContent='登録内容を変更する'; $('save').textContent='更新する'; });
    btn('複製','sub',()=>{ fill(r); $('fDate').value=''; $('d_weekday').checked=false; $('d_holiday').checked=false; flash('複製しました。運転日を入れて登録してください'); });
    btn('削除','del',async()=>{ if(!confirm(r.opDate+' '+(r.no||'番号なし')+' の登録を削除します。よろしいですか?')) return; try{ await gas('xdel',{id:r.id}); if(S.editing===r.id) clearForm(); await refresh(); }catch(e){ $('listMsg').textContent=e.message; $('listMsg').className='msg bad'; } });
    tr.appendChild(op); return tr;
  }));
  if(!rows.length){ const tr=mk('tr'), td=mk('td',null,'登録はありません'); td.colSpan=5; tr.appendChild(td); body.appendChild(tr); }
}

$('fDate').addEventListener('change',onDate);
$('rows').addEventListener('input',sum); $('rows').addEventListener('change',sum);
$('save').addEventListener('click',save); $('clear').addEventListener('click',clearForm); $('showPast').addEventListener('change',renderList);
</script>
</body>
