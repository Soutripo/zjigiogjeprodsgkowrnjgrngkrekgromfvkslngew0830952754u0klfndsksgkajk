<style>
  html,body{height:100%;margin:0}
  #login{position:fixed;inset:0;z-index:100;overflow:auto;background:#f2f2f2;color:#222;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;-webkit-text-size-adjust:100%}
  #login .lg-wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:19px}
  #login .lg-box{width:min(432px,100%);background:#fff;border:1px solid #9a9a9a}
  #login .lg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 17px;background:#222;color:#fff}
  #login .lg-sys{font-size:18px;font-weight:700;letter-spacing:.04em}
  #login .lg-tag{flex:none;font-size:14px;font-weight:700;padding:1px 10px;border:1px solid #fff;letter-spacing:.2em}
  #login .lg-body{padding:19px 19px 17px}
  #login .lg-note{margin:0 0 17px;font-size:14px;line-height:1.6;color:#444}
  #lgForm{display:flex;flex-direction:column;gap:14px}
  #lgForm label{display:flex;flex-direction:column;gap:5px;font-size:16px;font-weight:700;color:#222}
  #lgForm input{font:inherit;font-weight:400;font-size:19px;padding:10px 11px;border:1px solid #777;border-radius:0;color:#111;background:#fff;min-width:0;box-sizing:border-box;width:100%}
  #lgForm input:focus{outline:2px solid #222;outline-offset:-1px;border-color:#222}
  #lgForm button{font:inherit;font-size:18px;font-weight:700;padding:11px;border:1px solid #111;border-radius:0;background:#222;color:#fff;cursor:pointer;margin-top:2px;letter-spacing:.2em}
  #lgForm button:disabled{opacity:.5;cursor:default}
  #lgMsg{min-height:1.4em;font-size:14px;line-height:1.5;color:#222;white-space:pre-line}
  #lgMsg.bad{color:#b00020;font-weight:700}
  #login .lg-foot{margin:12px 0 0;font-size:13px;color:#666;text-align:center}
</style>
</head>
<body>
<div id="login">
  <div class="lg-wrap">
    <div class="lg-box">
      <div class="lg-head"><span class="lg-sys">運行図表</span><span class="lg-tag">業務用</span></div>
      <div class="lg-body">
        <form id="lgForm" autocomplete="on">
          <label>ID<input id="lgId" name="username" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required></label>
          <label>パスワード<input id="lgPw" name="password" type="password" autocomplete="current-password" autocapitalize="off" required></label>
          <button id="lgBtn" type="submit">ログイン</button>
          <div id="lgMsg" role="status" aria-live="polite"></div>
        </form>
      </div>
    </div>
    <p class="lg-foot">業務用 / 無断利用・無断転載を禁じます</p>
  </div>
</div>

<script>
/* SHA-256(外部ライブラリなし。Web Crypto が使えない環境でも動くよう自前で持つ) */
const SHA_K=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
const SHA_W=new Uint32Array(64);
function sha256(m){
  const l=m.length, nb=((l+9+63)>>6), buf=new Uint8Array(nb*64);
  buf.set(m); buf[l]=0x80;
  const dv=new DataView(buf.buffer);
  dv.setUint32(nb*64-8,Math.floor(l/0x20000000)); dv.setUint32(nb*64-4,(l<<3)>>>0);
  let a0=0x6a09e667,b0=0xbb67ae85,c0=0x3c6ef372,d0=0xa54ff53a,e0=0x510e527f,f0=0x9b05688c,g0=0x1f83d9ab,h0=0x5be0cd19;
  const w=SHA_W;
  for(let o=0;o<nb*64;o+=64){
    for(let i=0;i<16;i++) w[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){
      const x=w[i-15], y=w[i-2];
      const s0=((x>>>7)|(x<<25))^((x>>>18)|(x<<14))^(x>>>3);
      const s1=((y>>>17)|(y<<15))^((y>>>19)|(y<<13))^(y>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)|0;
    }
    let a=a0,b=b0,c=c0,d=d0,e=e0,f=f0,g=g0,h=h0;
    for(let i=0;i<64;i++){
      const S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7));
      const ch=(e&f)^(~e&g);
      const t1=(h+S1+ch+SHA_K[i]+w[i])|0;
      const S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10));
      const mj=(a&b)^(a&c)^(b&c);
      const t2=(S0+mj)|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
    }
    a0=(a0+a)|0;b0=(b0+b)|0;c0=(c0+c)|0;d0=(d0+d)|0;e0=(e0+e)|0;f0=(f0+f)|0;g0=(g0+g)|0;h0=(h0+h)|0;
  }
  const out=new Uint8Array(32), ov=new DataView(out.buffer);
  [a0,b0,c0,d0,e0,f0,g0,h0].forEach((v,i)=>ov.setUint32(i*4,v>>>0));
  return out;
}
const hex=u=>Array.from(u,b=>b.toString(16).padStart(2,'0')).join('');
/* ログイン管理サーバー(Google Apps Script)のURL と、サーバーが返す鍵の照合用ハッシュ */
const GAS_URL="https://script.google.com/macros/s/AKfycbyIF4vrLdoJFMoAJY89Cgrbb1VrYxyRKE_SM3BD7w0PYupJ-RpnKOMDaJST_VgzzcT0/exec";
const AUTH={"c": "e6b076f91e2a025118db0f586306971ea4c2c2d704ded1ba757cdc971de1c9da"};
/* ログイン後の表示処理は別ファイル viewer.js。ログイン成功後に読み込む(毎回最新を取得) */
function loadViewer(){
  if(window.ChichibuViewer) return Promise.resolve(window.ChichibuViewer);
  return new Promise((ok,ng)=>{
    const s=document.createElement('script'); s.src='viewer.js?t='+Date.now();
    s.onload=()=>window.ChichibuViewer?ok(window.ChichibuViewer):ng(new Error('viewer'));
    s.onerror=()=>ng(new Error('viewer'));
    document.head.appendChild(s);
  }).catch(()=>{ const x=new Error('表示プログラム(viewer.js)を読み込めません。通信状態を確認してください'); x.loadErr=true; throw x; });
}
(function(){
  const form=document.getElementById('lgForm'), idEl=document.getElementById('lgId'), pwEl=document.getElementById('lgPw');
  const btn=document.getElementById('lgBtn'), msg=document.getElementById('lgMsg'), box=document.getElementById('login');
  let fails=0, busy=false;
  const unhex=h=>Uint8Array.from(h.match(/../g)||[],x=>parseInt(x,16));
  /* この端末の識別子(最初に作って保存。サーバーが「1ID=1台」の確認に使う) */
  function devId(){
    try{
      let v=localStorage.getItem('gy_dev');
      if(!/^[0-9a-f]{32}$/.test(v||'')){
        const a=new Uint8Array(16);
        if(window.crypto&&crypto.getRandomValues) crypto.getRandomValues(a); else for(let i=0;i<16;i++) a[i]=Math.floor(Math.random()*256);
        v=hex(a); localStorage.setItem('gy_dev',v);
        if(localStorage.getItem('gy_dev')!==v) return null;
      }
      return v;
    }catch(_){ return null; }
  }
  function fail(text,penalty){
    msg.textContent=/管理者/.test(text)?text:text+'\n解決しない場合は、管理者にお問い合わせください。'; msg.className='bad'; pwEl.value=''; pwEl.focus();
    if(penalty) fails++;
    setTimeout(()=>{ busy=false; btn.disabled=false; },penalty?Math.min(5000,600*fails):300);
  }
  form.addEventListener('submit',e=>{
    e.preventDefault(); if(busy) return;
    busy=true; btn.disabled=true; msg.textContent='確認中…'; msg.className='';
    const id=idEl.value.trim(), pw=pwEl.value, dev=devId();
    if(!GAS_URL){ fail('ログイン管理サーバーが設定されていません',false); return; }
    if(!dev){ fail('この端末では端末の登録ができません。ブラウザのサイトデータの保存を許可してください',false); return; }
    const ac=new AbortController(), to=setTimeout(()=>ac.abort(),25000);
    fetch(GAS_URL,{method:'POST',body:JSON.stringify({a:'login',id:id,pw:pw,dev:dev}),signal:ac.signal,redirect:'follow',cache:'no-store'})
      .then(r=>r.json())
      .then(res=>{
        clearTimeout(to);
        if(!res||!res.ok||!res.key){ fail((res&&res.msg)||'ログインできません',true); return; }
        const key=unhex(res.key);
        if(hex(sha256(key))!==AUTH.c){ fail('設定が一致しません。管理者に連絡してください',false); return; }
        pwEl.value='';
        const onErr=e=>{ fail((e&&e.loadErr)?e.message:'データの復号に失敗しました。管理者に連絡してください',false); };
        return loadViewer().then(
          v=>v.unlock(key,{url:GAS_URL,tok:res.tok||'',dev:dev}).then(()=>{ box.remove(); v.show(); },onErr),
          onErr
        );
      })
      .catch(()=>{ clearTimeout(to); fail('接続できません。通信状態を確認してください',false); });
  });
  idEl.focus();
})();
</script>
